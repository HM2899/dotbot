name: Build web release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release scripts and Compose
        run: |
          bash -n deploy/package.sh deploy/source-package.sh deploy/docker/package.sh
          docker compose config --quiet
      - name: Build source archive
        run: bash deploy/source-package.sh
      - name: Build static Linux server in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1-alpine sh -c 'apk add --no-cache build-base pkgconf && cargo build --locked --release --target-dir target/dist-musl'
      - name: Assemble server archives (no images)
        env:
          DOTBOT_RELEASE_BINARY: target/dist-musl/release/dotbot
        run: bash deploy/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dotbot-web-linux-x86_64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotbot-web-linux-x86_64
          path: dist
      - name: Publish GitHub-built files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "dotbot $GITHUB_REF_NAME" --generate-notes
