[package]
name = "dotbot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Self-hosted persistent Bot teams with collaboration, memory and a shared desktop"

[dependencies]
pi-agent-core = { path = "crates/pi-agent-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
rust-embed = "8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
aes = "0.8"
md-5 = "0.10"
getrandom = "0.3"
base64 = "0.22"
mime_guess = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ed25519-dalek = "3.0.0"
hmac = "0.12"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
urlencoding = "2.1.3"
chrono-tz = "0.10"
argon2 = "0.5"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
