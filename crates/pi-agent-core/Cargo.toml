[package]
name = "pi-agent-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port and dotbot customization of pi-agent-core"

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
