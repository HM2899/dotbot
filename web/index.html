      <button id="toggle-theme" class="ghost theme"></button>
      <button id="toggle-lang" class="ghost lang" title="中文 / English">中文</button>
      <button class="icon" id="settings-close" data-settings-close data-i18n-title="Back to chat" data-i18n-aria-label="Back to chat" title="Back to chat" aria-label="Back to chat">✕</button>
    </div></header><div id="settings-content"></div></section>
  </div>
</section>
<div id="modal" hidden><div class="card" id="modal-card"></div></div>
<div id="file-preview-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="file-preview-title"></div>
<div id="toast" hidden></div>
<script>
// Runs before the external scripts, with no network wait: the first paint after a
// reload already shows the last conversation and labels in the chosen language,
// instead of a blank list and English text. app.js adopts it once live data loads.
window.dotbotReloadSnapshot = (() => {
  try {
    const saved = JSON.parse(sessionStorage.getItem('dotbot.reload-snapshot') || 'null')
    sessionStorage.removeItem('dotbot.reload-snapshot')
    const wanted = decodeURIComponent(location.hash.slice(1))
    if (!saved?.html || Date.now() - saved.at > 120_000 || (wanted && wanted !== saved.conversation)) return null
    const $ = id => document.getElementById(id)
    document.documentElement.lang = saved.lang
    for (const [attribute, words] of Object.entries(saved.labels)) {
      for (const el of document.querySelectorAll(`[data-i18n${attribute ? `-${attribute}` : ''}]`)) {
        const key = el.getAttribute(`data-i18n${attribute ? `-${attribute}` : ''}`)
        if (!(key in words)) continue
        if (attribute) el.setAttribute(attribute, words[key]); else el.textContent = words[key]
      }
    }
    $('main').className = saved.main ?? ''
    if (saved.settings) $('open-settings').innerHTML = saved.settings
    if (saved.actions) { const actions = document.querySelector('#head .actions'); actions.innerHTML = saved.actions; actions.querySelectorAll('details[open]').forEach(el => el.removeAttribute('open')) }
    if (saved.hint) $('composer-hint').innerHTML = saved.hint
    $('bots').innerHTML = saved.html.bots; $('messages').innerHTML = saved.html.messages
    $('head-avatar').innerHTML = saved.html.avatar; $('title').textContent = saved.html.title; $('subtitle').textContent = saved.html.subtitle
    // Shown only; nothing in it reacts until the live state has rendered.
    $('bots').inert = $('messages').inert = true
    $('messages').scrollTop = saved.top ?? 0
    return saved
  } catch { return null }
})()
</script>
