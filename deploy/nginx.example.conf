# In the http {} block (outside server {}), define this once:
# map $http_upgrade $dotbot_connection { default upgrade; '' close; }
# Insert these locations in an existing TLS-enabled server block for your chosen domain.
# Keep dotbot listening on loopback. Never expose its internal MCP endpoints.
location /internal/ {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:4870;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite client-supplied forwarding information.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dotbot_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    client_max_body_size 40m;
}
